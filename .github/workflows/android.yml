name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '!frontend/webhook-server/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install JS dependencies
        working-directory: frontend
        run: npm ci

      - name: Bump version code (must grow so the phone accepts it as an update)
        working-directory: frontend/android
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $((1000 + GITHUB_RUN_NUMBER))/" app/build.gradle
          grep -n "versionCode" app/build.gradle

      - name: Build release APK
        working-directory: frontend/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp frontend/android/app/build/outputs/apk/release/app-release.apk GETINSURE-CRM.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GETINSURE-CRM.apk \
            --title "GETINSURE CRM (build ${GITHUB_RUN_NUMBER})" \
            --notes "Built from commit ${GITHUB_SHA}" \
            --latest
